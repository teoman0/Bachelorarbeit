experiment_name: dinov3_bmw25_prototype_heatmaps
seed: 42

purpose: qualitative_prototype_heatmaps_no_training

dataset:
  root: "${BMW25_DATA_ROOT}"
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".tif"
    - ".tiff"
  classes:
    - folder: "Fräszustand Viertel"
      label: "Fraeszustand"
      ordinal: 0
      color_rgb: [90, 90, 90]
    - folder: "Erste Bearbeitungssufe Viertel"
      label: "Stufe_1"
      ordinal: 1
      color_rgb: [42, 116, 214]
    - folder: "Zweite Bearbeitungsstufe Viertel"
      label: "Stufe_2"
      ordinal: 2
      color_rgb: [238, 152, 35]
    - folder: "Finaler Zustand Viertel"
      label: "Final"
      ordinal: 3
      color_rgb: [38, 170, 95]

split:
  group_regex: "(.+?)_q[1-4](?:\\b|$)"
  exclude_multilabel_groups_from_reference: true
  prefer_multilabel_preview_groups: true
  reference_groups_per_class: 4
  max_reference_images_per_class: 8
  preview_groups_per_class: 1
  preview_images_per_class: 1

patches:
  patch_size: 224
  stride: 224
  drop_incomplete: false

model:
  name: facebook/dinov3-vits16-pretrain-lvd1689m
  source: huggingface
  local_files_only: false
  device: auto
  batch_size: 8

scoring:
  pooling: pooler_or_cls
  softmax_temperature: 0.03

output:
  directory: outputs/dinov3_bmw25_prototype_heatmaps
  overlay_alpha: 112
  direct_overlay_alpha: 92
  direct_overlay_min_alpha: 28
  direct_overlay_scale_by_confidence: true
  direct_overlay_grid: true
