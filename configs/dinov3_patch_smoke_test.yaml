experiment_name: dinov3_patch_smoke_test
seed: 42

purpose: technical_smoke_test_no_training

input:
  image_path: null
  synthetic_fallback: true
  synthetic_width: 512
  synthetic_height: 512

patches:
  patch_size: 224
  stride: 224
  max_patches: 16
  drop_incomplete: true

model:
  name: facebook/dinov3-vits16-pretrain-lvd1689m
  source: huggingface
  local_files_only: false
  device: auto
  batch_size: 4

features:
  pooling: pooler_or_cls
  save_embeddings: false

output:
  directory: outputs/dinov3_patch_smoke_test
  save_patch_overlay: true
