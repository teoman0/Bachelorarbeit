template: true
template_note: "Template only. Copy to configs/experiments/ and replace placeholders before a final evaluation."

experiment:
  name: "<experiment_name>"
  stage: "evaluation_template"
  purpose: "global_image_classification_evaluation"

evaluation:
  experiment_name: "<experiment_name>"
  prediction_files:
    - "outputs/<model_run>/predictions.csv"
  split_manifest: "data/splits/<split_manifest>.csv"
  split_name: "test"
  class_names:
    - "<class_1>"
    - "<class_2>"
    - "<class_3>"
    - "<class_4>"
  primary_metric: "macro_f1"
  secondary_metrics:
    - "balanced_accuracy"
    - "accuracy"
    - "precision_per_class"
    - "recall_per_class"
    - "f1_per_class"
  confusion_matrix:
    enabled: true
    labels: "class_names_order"
    normalize: "optional_for_reporting_only"
  ordinal_evaluation:
    enabled: false
    class_order:
      - "<class_1>"
      - "<class_2>"
      - "<class_3>"
      - "<class_4>"
    metrics:
      - "mean_absolute_class_distance"
    note: "Enable only after the ordinal class order is documented."

reproducibility:
  config_id: "<config_id>"
  split_version: "<split_version>"
  git_commit: "<record_at_runtime>"
  package_versions: "<record_at_runtime>"
  model_variant: "<model_variant>"
  seed: "<seed>"
  hardware: "<record_at_runtime>"
  evaluated_at_utc: "<record_at_runtime>"

output:
  output_dir: "outputs/<experiment_name>/evaluation"
  artifact_policy:
    raw_data: "do_not_commit"
    model_weights: "do_not_commit"
    checkpoints: "do_not_commit"
    feature_caches: "do_not_commit"
    prediction_files: "local_outputs_do_not_commit_unless_explicitly_curated"
    evaluation_outputs: "local_outputs_do_not_commit_unless_explicitly_curated"
