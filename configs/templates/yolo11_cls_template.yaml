template: true
template_note: "Template only. Copy to configs/experiments/ and replace placeholders before training."

experiment:
  name: "<experiment_name>"
  stage: "not_final"
  purpose: "global_image_classification_baseline"
  seed: 42

dataset:
  dataset_id: "<dataset_id>"
  split_manifest: "data/splits/<split_manifest>.csv"
  class_count: 4
  image_root_env: "<DATA_ROOT_ENV_VAR>"
  relative_paths_only: true

split:
  strategy: "grouped_stratified"
  ratio: [0.70, 0.15, 0.15]
  group_id_source: "filename_q_suffix"
  group_regex: "^(?P<group>.+?)[_-](?:q|quarter|viertel)[_-]?[1-4]$"

input:
  size: [224, 224]
  candidate_sizes: [[224, 224], [320, 320]]
  channels: 3
  grayscale_handling: "convert_to_rgb_by_channel_duplication"

preprocessing:
  resize_strategy: "model_default_or_resize_pad_to_square"
  normalization: "ultralytics_default"
  raw_data_policy: "do_not_modify_raw_images"

augmentations:
  train:
    horizontal_flip: "to_validate"
    vertical_flip: "to_validate"
    rotate_90: "to_validate"
    brightness_contrast: "light"
    crop_or_resize: "light"
  val_test: "deterministic_preprocessing_only"

model:
  group: "yolo11_cls"
  variant: "<yolo11n-cls_or_yolo11s-cls>"
  pretrained: true
  weights_source: "<ultralytics_model_source>"
  license_note: "Ultralytics AGPL-3.0 / Enterprise context; document exact version and model terms."

training:
  enabled: true
  optimizer: "<ultralytics_or_explicit_optimizer>"
  scheduler: "<ultralytics_or_explicit_scheduler>"
  batch_size: "<to_define>"
  epochs: "<to_define>"

metrics:
  global:
    - accuracy
    - balanced_accuracy
    - macro_f1
    - precision_per_class
    - recall_per_class
    - confusion_matrix
  ordinal: "optional_if_class_order_is_validated"

reproducibility:
  package_versions: "<record_at_runtime>"
  git_commit: "<record_at_runtime>"
  config_path: "<record_at_runtime>"
  output_dir: "outputs/<experiment_name>"
  artifact_policy: "do_not_commit_raw_data_weights_checkpoints_caches_or_large_outputs"
