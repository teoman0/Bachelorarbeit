template: true
template_note: "Template only. Copy to configs/experiments/ and replace placeholders before patch analysis."

experiment:
  name: "<experiment_name>"
  stage: "not_final"
  purpose: "qualitative_patch_heatmap_analysis"
  seed: 42

dataset:
  dataset_id: "<dataset_id>"
  split_manifest: "data/splits/<split_manifest>.csv"
  class_count: 4
  image_root_env: "<DATA_ROOT_ENV_VAR>"
  relative_paths_only: true

split:
  strategy: "use_existing_grouped_split"
  ratio: [0.70, 0.15, 0.15]
  group_id_source: "filename_q_suffix"
  group_regex: "^(?P<group>.+?)[_-](?:q|quarter|viertel)[_-]?[1-4]$"
  patch_generation_after_split: true

input:
  size: [224, 224]
  candidate_sizes: [[224, 224]]
  channels: 3
  grayscale_handling: "convert_to_rgb_by_channel_duplication"

preprocessing:
  resize_strategy: "patch_crop_then_model_processor"
  normalization: "dinov3_model_processor"
  raw_data_policy: "do_not_modify_raw_images"

augmentations:
  train:
    horizontal_flip: "not_applicable_for_qualitative_inference_or_to_validate_if_training_patch_head"
    vertical_flip: "not_applicable_for_qualitative_inference_or_to_validate_if_training_patch_head"
    rotate_90: "not_applicable_for_qualitative_inference_or_to_validate_if_training_patch_head"
    brightness_contrast: "not_applicable_for_qualitative_inference_or_to_validate_if_training_patch_head"
    crop_or_resize: "patch_grid_defined_by_patch_settings"
  val_test: "deterministic_preprocessing_only"

patches:
  patch_size: 224
  stride: 224
  overlap: 0
  drop_incomplete: "to_define"
  label_source: "global_image_label_noisy_for_local_regions"

model:
  group: "dinov3_patch_based"
  variant: "<dinov3_backbone_variant>"
  pretrained: true
  freeze_backbone: true
  classifier_source: "<global_dinov3_head_or_patch_head_to_define>"
  weights_source: "<dinov3_weight_source>"
  license_note: "DINOv3 License; heatmaps are qualitative local classification maps, not segmentation masks."

features:
  cache_enabled: "optional"
  cache_dir: "<local_cache_outside_repo>"
  cache_policy: "do_not_commit_feature_caches"

training:
  enabled: "optional_patch_head_only_if_justified"
  optimizer: "<not_applicable_or_to_define>"
  scheduler: "<not_applicable_or_to_define>"
  batch_size: "<to_define>"
  epochs: "<not_applicable_or_to_define>"

metrics:
  global:
    - qualitative_heatmap_review
    - optional_patch_level_summary_on_validation_only
  ordinal: "not_primary"

reproducibility:
  package_versions: "<record_at_runtime>"
  git_commit: "<record_at_runtime>"
  config_path: "<record_at_runtime>"
  output_dir: "outputs/<experiment_name>"
  artifact_policy: "do_not_commit_raw_data_weights_checkpoints_caches_or_large_outputs"
